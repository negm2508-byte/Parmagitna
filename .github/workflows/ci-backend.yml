name: Backend CI

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/ci-backend.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/ci-backend.yml' ]

jobs:
  build-and-test:
    name: Backend Build & Automated Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Compile, Migrate Schema & Execute Unit/Integration Tests
        working-directory: ./backend
        run: ./mvnw clean verify -B
