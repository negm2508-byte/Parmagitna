spring:
  datasource:
    url: jdbc:h2:mem:paper_erp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: dGhpcy1pcy1hLXNhZmUtZGVmYXVsdC0yNTYtYml0LWtleS1mb3ItZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u
    expiration-minutes: 15
    refresh-expiration-hours: 8
    cookie-secure: false
    cookie-same-site: Lax
  rate-limiting:
    backend: in-memory
    redis-failure-mode: fail-closed
    lockout-duration-seconds: 900
