# Automated Test Profile (Clean in-memory PostgreSQL compatibility mode)
spring:
  datasource:
    url: jdbc:h2:mem:papererp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 0

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
